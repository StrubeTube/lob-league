name: Refresh from Sleeper

on:
  schedule:
    - cron: "17 11 * * *" # daily, ~7:17am ET
  workflow_dispatch: {} # manual "Run workflow" button on GitHub

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull current league data from Sleeper
        run: python refresh_2026.py
      - name: Rebuild the site
        run: python build_site.py
      - name: Commit and push if anything changed
        run: |
          git config user.name "lob-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data docs
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Auto-refresh from Sleeper"
            git push
          fi
