<script>
const DATA = /*__DATA__*/{};
const CFG = DATA.cfg;
/* THE 2026 RULES (adopted): flattened salary table, exactly 3 keepers (no
   budget), keeper salaries count against team salary, keepers slot on the
   board at their keep round, $230 cap / $160 floor band checked on trades. */
let TABLE = CFG.table, KCAP = 'on', SLOT = 'round';
const CAPTXT = isFinite(CFG.cap) ? ('$' + CFG.cap) : 'no cap';
const escal = (r,s)=>{const n=r-s;return n>=1?TABLE[n]:TABLE[1]+6*(1-n);};
/* keep round: fresh 2025 draftees keep at their drafted round for one year
   (kp=0, no escalation yet); players who were already keepers in 2025 (kp=1)
   escalate one round now. kr26 = the round the keep actually occupies. */
DATA.teams.forEach(tm=>tm.players.forEach(p=>{if(p.el){
  p.k26=escal(p.r,p.kp?1:0);p.k27=escal(p.r,p.kp?2:1);
  p.kr26=Math.max(1,p.r-(p.kp?1:0));
}}));
const $ = (t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e;};

/* ---------- state ---------- */
const MYKEY='ggg-my-team';
let myTeam=parseInt(localStorage.getItem(MYKEY) ?? '-1');
/* keepers are whatever Sleeper says — teams set them in the app, they sync
   here on every visit (no picking keepers on this site anymore) */
let OFFICIAL={};
DATA.teams.forEach((tm,ti)=>{if(tm.ok&&tm.ok.length)OFFICIAL[ti]=tm.ok;});
try{const c=JSON.parse(localStorage.getItem('ggg-okeep-v1'));if(c&&c.map)OFFICIAL=c.map;}catch(e){}
const sel=ti=>new Set((OFFICIAL[ti]||[]).slice(0,CFG.maxKeep));
async function syncSleeper(){
  if(!DATA.leagueId2026)return null;
  const rosters=await fetch('https://api.sleeper.app/v1/league/'+DATA.leagueId2026+'/rosters').then(r=>r.json());
  const map={};
  (rosters||[]).forEach(r=>{
    const ti=DATA.teams.findIndex(t=>t.rid===r.roster_id);
    if(ti<0)return;
    const idx=[];
    (r.keepers||[]).map(String).forEach(pid=>{
      const i=DATA.teams[ti].players.findIndex(p=>p.pid===pid);
      if(i>=0)idx.push(i);
    });
    if(idx.length)map[ti]=idx;
  });
  OFFICIAL=map;
  try{localStorage.setItem('ggg-okeep-v1',JSON.stringify({ts:Date.now(),map}));}catch(e){}
  return map;
}

function evalTeam(ti){
  const tm=DATA.teams[ti],chosen=sel(ti);
  let keepSpend=0,maxSel=0,franchiseName=null;
  chosen.forEach(pi=>{const p=tm.players[pi];keepSpend+=p.k26;
    if(p.k26>maxSel){maxSel=p.k26;franchiseName=p.n;}});
  const budgetSpend=(CFG.franchise&&chosen.size)?keepSpend-maxSel:keepSpend;
  let next27=0;chosen.forEach(pi=>next27+=tm.players[pi].k27);
  const k=chosen.size;
  let draftSpend=0,fills=0,usedPicks=0,opening=0;
  if(SLOT==='round'){
    /* EVERY held pick counts against the cap — 16 is the roster limit,
       not a cap exemption; surplus picks still carry their salary */
    tm.picks.forEach(p=>draftSpend+=TABLE[p.r]);   // keepers occupy their round's pick
    if(KCAP==='off'){
      let kr=0;chosen.forEach(pi=>{const p=tm.players[pi];if(p.el)kr+=TABLE[p.r];});
      draftSpend=Math.max(0,draftSpend-kr);
    }
    usedPicks=tm.picks.length;
    opening=draftSpend;
  }else{
    const picks=tm.picks.slice();
    picks.splice(Math.max(0,picks.length-k),k);
    const slots=16-k,used=picks.slice(0,slots);
    used.forEach(p=>draftSpend+=TABLE[p.r]);
    fills=Math.max(0,slots-used.length);
    usedPicks=used.length;
    opening=(KCAP==='off'?0:keepSpend)+draftSpend+fills*CFG.waiver;
  }
  return {keepSpend,budgetSpend,franchiseName,next27,k,draftSpend,fills,usedPicks,opening};
}
const capital=ti=>DATA.teams[ti].picks.reduce((a,p)=>a+TABLE[p.r],0);

/* ---------- helpers ---------- */
function card(span,title,chipTxt){
  const c=$('div','dcard c'+span);
  const h=$('div','dcard-head');
  h.appendChild($('h3','cardh',title));
  if(chipTxt)h.appendChild($('span','chip soon',chipTxt));
  c.appendChild(h);
  return c;
}
function skel(card,lines){
  for(let i=0;i<lines;i++){const s=$('div','skel');s.style.width=(88-i*14)+'%';card.appendChild(s);}
}

/* ---------- team picker ---------- */
const bar=document.getElementById('teambar');
DATA.teams.forEach((tm,ti)=>{
  const b=$('button','tpill',tm.name);b.type='button';
  b.addEventListener('click',()=>{myTeam=ti;localStorage.setItem(MYKEY,String(ti));cbOpen=ti;render();});
  bar.appendChild(b);
});

/* ---------- render ---------- */
function render(){
  [...bar.children].forEach((b,i)=>b.classList.toggle('active',i===myTeam));
  renderIdentity();
  renderDash();
}

function renderIdentity(){
  const host=document.getElementById('identity');host.textContent='';
  if(myTeam<0)return;
  const tm=DATA.teams[myTeam],c=DATA.career.find(x=>x.name===tm.name);
  document.getElementById('heroTitle').textContent=tm.name+' HQ';
  const nowName=(c&&c.names.length)?c.names[c.names.length-1].tn:tm.name;
  document.getElementById('heroSub').textContent=liveSub||'Keepers, cap, and what’s next for the 2026 season.';
  if(!c)return;
  const band=$('div','idband');
  const badge=$('div','archbadge');
  badge.appendChild($('div','idname',nowName));
  badge.appendChild($('div','archname','2026'));
  band.appendChild(badge);
  const mid=$('div','idmid');
  const chips=$('div','chiprow');
  [['wk',c.w+'-'+c.l+' all-time'],
   ...(c.titles?[['gold','🏆 ×'+c.titles]]:[]),
   ...(c.toilets?[['fire','🚽 ×'+c.toilets]]:[]),
   ['even','luck '+(c.luck>0?'+':'')+c.luck],
   ['even',(c.pf/(c.w+c.l)).toFixed(1)+' PPG'],
   ['even',c.high_weeks+' weekly highs']].forEach(([cls,txt])=>chips.appendChild($('span','chip '+cls,txt)));
  mid.appendChild(chips);
  band.appendChild(mid);
  host.appendChild(band);
}

/* assign the chosen keepers to the team's held picks — the shared rule:
   priciest keep first, exact keep round if that pick is free, otherwise the
   next earlier free pick (covers traded-away rounds AND two keeps colliding
   on the same round). Returns {picks16, asg: playerIndex -> pick item}. */
function assignKeeps(tm,chosen){
  const picks16=tm.picks.map(p=>({type:'pick',r:p.r,from:p.from,cost:TABLE[p.r],name:null,pi:null}));
  const asg={};
  [...chosen].map(pi=>({pi,p:tm.players[pi]})).filter(x=>x.p.el)
    .sort((a,b)=>b.p.k26-a.p.k26)
    .forEach(({pi,p})=>{
      const it=picks16.find(x=>x.pi===null&&x.r===p.kr26)
        ||[...picks16].reverse().find(x=>x.pi===null&&x.r<=p.kr26)
        ||picks16.find(x=>x.pi===null);
      if(it){it.pi=pi;asg[pi]=it;}
    });
  return {picks16,asg};
}

/* ---------- per-team cap breakdown (expands under a cap-board row) ---------- */
const BASE16=(()=>{let s=0;for(let r=1;r<=16;r++)s+=TABLE[r];return s;})();
let cbOpen=myTeam>=0?myTeam:-1;   /* one open breakdown at a time */

function capDetail(ti){
  const tm=DATA.teams[ti],ev=evalTeam(ti),chosen=sel(ti);
  const box=$('div','cbdetail');

  /* the anatomy bar: every 2026 pick priced, keepers sitting in their rounds */
  const {picks16,asg}=assignKeeps(tm,chosen);
  Object.entries(asg).forEach(([pi,it])=>{it.type='keeper';it.name=tm.players[pi].n;});
  const items=[...picks16].sort((a,b)=>b.cost-a.cost);
  const scale=Math.max(isFinite(CFG.cap)?CFG.cap+30:0,ev.opening+15,(CFG.floor||0)+40,280);
  const wrap=$('div','anatwrap');
  const bar=$('div','anatbar');
  const tip=$('div','anattip');tip.hidden=true;
  let acc=0;
  items.forEach(it=>{
    if(it.cost<=0)return;
    const seg=$('div','anatseg '+(it.type==='keeper'?'k':'d'));
    const pct=it.cost/scale*100;
    seg.style.width=pct+'%';
    const lab=(it.type==='keeper'?it.name:'R'+it.r)+' · $'+it.cost;
    const full=lab+(it.type==='pick'?(' pick'+(it.from?' via '+it.from:'')):' — keeper');
    seg.title=full;
    if(it.cost/scale>=0.022)seg.appendChild($('span',null,lab));
    const center=Math.min(92,Math.max(8,acc+pct/2));
    const show=e=>{e.stopPropagation();tip.textContent=full;tip.style.left=center+'%';tip.hidden=false;};
    seg.addEventListener('mouseenter',show);
    seg.addEventListener('click',show);
    seg.addEventListener('mouseleave',()=>tip.hidden=true);
    acc+=pct;
    bar.appendChild(seg);
  });
  wrap.appendChild(bar);
  wrap.appendChild(tip);
  if(isFinite(CFG.cap)){
    const l=$('div','anatline');l.style.left=(CFG.cap/scale*100)+'%';wrap.appendChild(l);
    const t=$('div','anattag','CAP $'+CFG.cap);t.style.left=(CFG.cap/scale*100)+'%';wrap.appendChild(t);
  }
  if(CFG.floor>0){
    const l=$('div','anatline floor');l.style.left=(CFG.floor/scale*100)+'%';wrap.appendChild(l);
    const t=$('div','anattag floor','FLOOR $'+CFG.floor);t.style.left=(CFG.floor/scale*100)+'%';wrap.appendChild(t);
  }
  box.appendChild(wrap);

  /* totals line */
  const tot=$('div','anattotal');
  const d2=CFG.cap-ev.opening;
  tot.appendChild($('b',ev.opening>CFG.cap?'bad':'','Opening cap $'+ev.opening));
  let txt=isFinite(CFG.cap)?(d2>=0?(' — $'+d2+' under the cap'):(' — $'+(-d2)+' OVER the cap')):' — no cap set';
  if(CFG.floor>0)txt+=ev.opening>=CFG.floor?(' · $'+(ev.opening-CFG.floor)+' above the floor'):(' · $'+(CFG.floor-ev.opening)+' BELOW the floor');
  tot.appendChild(document.createTextNode(txt));
  box.appendChild(tot);

  /* why: the trade ledger — every pick gained and sent, priced */
  const gained=tm.picks.filter(p=>p.from);
  const ownHeld=new Set(tm.picks.filter(p=>!p.from).map(p=>p.r));
  const sent=[];
  for(let r=1;r<=16;r++)if(!ownHeld.has(r)){
    let to=null;
    DATA.teams.forEach(t2=>{if(t2!==tm&&t2.picks.some(q=>q.from===tm.name&&q.r===r))to=t2.name;});
    sent.push({r,to});
  }
  box.appendChild($('div','mlabel','Why $'+ev.opening+'? The pick trades'));
  const lr=$('div','chiprow');
  gained.forEach(p=>lr.appendChild($('span','chip ok','+ R'+p.r+' via '+p.from+' (+$'+TABLE[p.r]+')')));
  sent.forEach(s2=>lr.appendChild($('span','chip flag','− R'+s2.r+(s2.to?(' to '+s2.to):'')+' (−$'+TABLE[s2.r]+')')));
  if(!gained.length&&!sent.length)lr.appendChild($('span','chip even','No pick trades — a clean 16-round sheet'));
  box.appendChild(lr);
  const gainedVal=gained.reduce((a,p)=>a+TABLE[p.r],0);
  const sentVal=sent.reduce((a,s2)=>a+TABLE[s2.r],0);
  let m='$'+BASE16+' (all 16 own rounds)';
  if(sentVal)m+=' − $'+sentVal+' traded away';
  if(gainedVal)m+=' + $'+gainedVal+' acquired';
  const n=tm.picks.length;
  m+=' = $'+ev.opening;
  if(n>16)m+=' · holds '+n+' picks — every pick counts against the cap, but only 16 make the roster';
  if(n<16)m+=' · only '+n+' picks — the last '+(16-n)+' roster spot'+(16-n===1?'':'s')+' fill with $0 waivers';
  box.appendChild($('p','cardnote2',m));

  /* the keepers, straight from Sleeper */
  box.appendChild($('div','mlabel','Keepers'+(chosen.size?(' — 🔒 '+chosen.size+' official from Sleeper'):'')));
  if(chosen.size){
    const kl=$('div','klist');
    [...chosen].map(pi=>({pi,p:tm.players[pi]})).filter(x=>x.p.el)
      .sort((a,b)=>b.p.k26-a.p.k26)
      .forEach(({pi,p})=>{
        const row=$('div','kchip');
        const im=document.createElement('img');im.className='pshot';im.alt='';im.loading='lazy';
        im.src='https://sleepercdn.com/content/nfl/players/'+p.pid+'.jpg';
        im.onerror=function(){this.style.visibility='hidden';};
        row.appendChild(im);
        row.appendChild($('b',null,p.n));
        const it=asg[pi];
        row.appendChild($('span','meta',p.pos+(p.t?' · '+p.t:'')+' · R'+(it?it.r:p.kr26)+' · $'+p.k26+(p.kp?' · kept ’25':'')));
        if(it&&it.r!==p.kr26){
          const noPick=!tm.picks.some(x=>x.r===p.kr26);
          row.appendChild($('span','meta bad','⚠ R'+p.kr26+(noPick?' pick traded away':' taken by a pricier keep')+' — slots at R'+it.r));
        }
        kl.appendChild(row);
      });
    box.appendChild(kl);
  }else{
    box.appendChild($('p','mut small','No official keepers in Sleeper yet — once they lock in, they appear here and slot into these picks automatically (solid segments).'));
  }
  return box;
}

/* the adopted 2026 rules, in one glance */
function rulesCard(){
  const c=card(12,'The 2026 rules');
  const t=$('div','tiles');
  [['$30 → $2','Salary = draft round. R1 costs $'+TABLE[1]+', R16 costs $'+TABLE[16]+'. The board sets every price automatically.'],
   ['3 keepers','Keep up to 3. A keeper costs his keep round — the round he was drafted, one earlier per year already kept — and burns that pick.'],
   [CAPTXT+' / $'+CFG.floor,'The cap band. No trade may move a roster the wrong way outside it: further over the cap, or further under the floor.'],
   ['$0 waivers','Waiver and free-agent adds are free, so every team can always field a lineup — even in cap jail.']]
    .forEach(([num,lbl])=>{const tile=$('div','tile');
      tile.appendChild($('div','num',num));tile.appendChild($('div','lbl',lbl));t.appendChild(tile);});
  c.appendChild(t);
  c.appendChild($('p','cardnote','Check any deal against the band in the Trade Tester before you propose it.'));
  return c;
}

function renderDash(){
  const dash=document.getElementById('dash');dash.textContent='';
  if(myTeam<0){
    const c=card(12,'Pick your team above');
    c.appendChild($('p','mut','The dashboard builds itself around your franchise — keepers, cap, grudges, draft capital, and your whole history.'));
    dash.appendChild(c);
    dash.appendChild(capBoardCard(12));
    dash.appendChild(rulesCard());
    return;
  }
  const tm=DATA.teams[myTeam],c=DATA.career.find(x=>x.name===tm.name);

  /* --- league cap board (span 12) — tap any team for the full breakdown --- */
  dash.appendChild(capBoardCard(12));

  /* --- the adopted 2026 rules (span 12) --- */
  dash.appendChild(rulesCard());

  /* --- countdown + vitals (span 3) --- */
  const cd=card(3,'Season countdown');
  /* kickoff Sep 10 · draft 3 days before · keeper deadline 1 week before the draft */
  const EVENTS=[['NFL kickoff',new Date('2026-09-10T20:20:00-04:00')]];
  const dTo=d3=>Math.max(0,Math.ceil((d3-Date.now())/86400000));
  const fmt=d3=>d3.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  const nxt=EVENTS.find(([,d3])=>d3>Date.now())||EVENTS[EVENTS.length-1];
  const rows=$('div','cdrows');
  EVENTS.forEach(([n2,d3])=>{
    const r=$('div','cdrow');
    const left=$('div');
    left.appendChild($('div','cdlab',n2));
    left.appendChild($('div','mut small',fmt(d3)));
    r.appendChild(left);
    const num=$('div','cdnum'+(n2===nxt[0]?' good':''),String(dTo(d3)));
    num.appendChild($('small',null,'d'));
    r.appendChild(num);
    rows.appendChild(r);
  });
  cd.appendChild(rows);
  cd.appendChild($('div','vitals'));
  const rr=$('div','vrow');rr.appendChild($('span','mut','Sleeper status'));
  const rs=$('span',null,liveStatus||(DATA.leagueId2026?'renewed ✓ · draft not set':'waiting on renewal'));
  rr.appendChild(rs);
  cd.lastChild.appendChild(rr);
  dash.appendChild(cd);

  /* --- draft capital (span 3) --- */
  const dc=card(3,'2026 draft capital');
  const cap$=capital(myTeam);
  const ranks=DATA.teams.map((_,i)=>capital(i)).sort((a,b)=>b-a);
  const myRank=ranks.indexOf(cap$)+1;
  const bn2=$('div','bignum');bn2.appendChild(document.createTextNode('$'+cap$));
  bn2.appendChild($('small',null,' · #'+myRank+' in league'));
  dc.appendChild(bn2);
  const pcs=$('div','pickchips');
  tm.picks.forEach(p=>{const ch=$('span','pk','R'+p.r);if(p.from)ch.appendChild($('span','frm',' · '+p.from));pcs.appendChild(ch);});
  dc.appendChild(pcs);
  dash.appendChild(dc);

  /* --- matchup center + playoff odds placeholder (span 6) --- */
  const mc=card(6,'Matchup center & playoff odds','LIVE WK 1');
  const mcrow=$('div','mcrow');
  const mcl=$('div','mcl');
  const vs=$('div','vsrow');
  vs.appendChild($('div','vsteam',tm.name));
  vs.appendChild($('div','vsmark','VS'));
  vs.appendChild($('div','vsteam mut','Week 1 opponent'));
  mcl.appendChild(vs);
  skel(mcl,3);
  mcrow.appendChild(mcl);
  const gauge=$('div','gauge');gauge.appendChild($('div','gaugev','—%'));
  mcrow.appendChild(gauge);
  mc.appendChild(mcrow);
  mc.appendChild($('p','cardnote','Live scores, win probability from a Monte Carlo sim of the remaining schedule, your all-time record vs this opponent, and their cap sheet.'));
  dash.appendChild(mc);

  /* ======= everything below is historical → collapsible section ======= */
  const hist=$('div','dash histgrid');

  /* --- season finishes (span 12) --- */
  const tlc=card(12,'Season finishes');
  const tl=$('div','timeline');
  DATA.finishes[tm.name].forEach(f=>{
    const cell=$('div','tcell '+(f.champ?'gold':(f.toilet?'fire':'')));
    cell.appendChild($('div','tyear',f.s));
    cell.appendChild($('div','tplace',f.champ?'🏆':(f.toilet?'🚽':'#'+f.place)));
    tl.appendChild(cell);
  });
  tlc.appendChild(tl);
  hist.appendChild(tlc);

  /* --- manager DNA (span 3) --- */
  const dna=card(3,'Manager DNA');
  [['Trades (career)',c.trades_n],['Waiver/FA adds',c.adds_n],
   ['Trades won / fleeced',c.fleeces+' / '+c.fleeced],
   ['Avg bench pts left',c.avg_bench],
   ['Best win streak','W'+c.streak_w],['Worst skid','L'+c.streak_l]]
    .forEach(([k2,v])=>{const r=$('div','vrow');r.appendChild($('span','mut',k2));r.appendChild($('span',null,String(v)));dna.appendChild(r);});
  hist.appendChild(dna);

  /* --- names history (span 3) --- */

  [...c.names].reverse().forEach(n=>{
    if(seen.has(n.tn))return;seen.add(n.tn);
    const r=$('div','vrow');r.appendChild($('span','mut',n.s));r.appendChild($('span','tn',n.tn));nh.appendChild(r);
  });
  hist.appendChild(nh);

  /* --- grudges (span 6) --- */
  const g=card(6,'Career grudges');
  const mine=DATA.h2h[tm.name]||{};
  const ent=Object.entries(mine);
  if(ent.length){
    const best=ent.reduce((a,b)=>(b[1].w-b[1].l)>(a[1].w-a[1].l)?b:a);
    const worst=ent.reduce((a,b)=>(b[1].w-b[1].l)<(a[1].w-a[1].l)?b:a);
    const duo=$('div','nemduo');
    const v1=$('div','nemcard good2');
    v1.appendChild($('div','cardh','Your victim'));
    v1.appendChild($('div','nemname',best[0]));
    v1.appendChild($('div','nemrec good',best[1].w+'-'+best[1].l));
    const v2=$('div','nemcard bad2');
    v2.appendChild($('div','cardh','Your nemesis'));
    v2.appendChild($('div','nemname',worst[0]));
    v2.appendChild($('div','nemrec bad',worst[1].w+'-'+worst[1].l));
    duo.appendChild(v1);duo.appendChild(v2);
    g.appendChild(duo);
  }
  const gr=$('div','grudges');
  ent.sort((a,b)=>(b[1].w-b[1].l)-(a[1].w-a[1].l)).forEach(([rival,rec])=>{
    const cls=rec.w>rec.l?'winrec':(rec.w<rec.l?'loserec':'');
    const cell=$('div','gcell');
    cell.appendChild($('div','gname',rival));
    cell.appendChild($('div','grec '+cls,rec.w+'-'+rec.l));
    gr.appendChild(cell);
  });
  g.appendChild(gr);
  hist.appendChild(g);

  /* --- team history dropdown (span 12) --- */
  const det=document.createElement('details');
  det.className='histbox';
  const sum=document.createElement('summary');
  sum.textContent='Team history & all-time stats';
  det.appendChild(sum);
  det.appendChild(hist);
  dash.appendChild(det);
}

let cbFilter='all', cbYear='2026';
function capBoardCard(span){
  const cb=card(span,'League cap board — where every dollar comes from');
  const yr=$('div','filterrow tight');
  [['2026','2026'],['2027','2027 outlook']].forEach(([key,lab])=>{
    const b=$('button','tpill sm'+(cbYear===key?' active':''),lab);b.type='button';
    b.addEventListener('click',()=>{cbYear=key;render();});
    yr.appendChild(b);
  });
  cb.appendChild(yr);

  if(cbYear!=='2026'){
    cb.appendChild($('p','cardnote2','2027 draft capital only — each team’s held 2027 picks priced by the salary table. Keeper costs can’t exist yet; this is the floor each roster starts from.'));
    const rows=DATA.teams.map(tm=>{
      const picks=tm.p27;
      return {name:tm.name,held:tm.p27.length,val:picks.reduce((a,p)=>a+TABLE[p.r],0),
              acquired:tm.p27.filter(p=>p.from).length};
    }).sort((a,b)=>b.val-a.val);
    rows.forEach(r=>{
      const row=$('div','cbrow');
      const nm=$('div','cbname');
      nm.appendChild($('span','cbteam',r.name));
      nm.appendChild($('span','chip mini',r.held+' picks'));
      row.appendChild(nm);
      const track=$('div','cbtrack');
      const seg=$('div','cbseg d');
      seg.style.left='0';seg.style.width=(Math.min(r.val,250)/250*100)+'%';
      track.appendChild(seg);
      const cap=$('div','cbcap');cap.style.left=(CFG.cap/250*100)+'%';track.appendChild(cap);
      row.appendChild(track);
      const val=$('div','cbval');
      val.appendChild($('b',r.val>CFG.cap?'bad':'','$'+r.val));
      val.appendChild($('span','mut small',r.acquired?(r.acquired+' acquired'):'own picks'));
      row.appendChild(val);
      cb.appendChild(row);
    });
    cb.appendChild(tradeBtn());
    cb.appendChild($('p','cardnote','Updates automatically as 2027 picks get traded.'));
    return cb;
  }

  const fr=$('div','filterrow tight');
  [['all','Total'],['k','Keepers only'],['d','Draft picks only']].forEach(([key,lab])=>{
    const b=$('button','tpill sm'+(cbFilter===key?' active':''),lab);b.type='button';
    b.addEventListener('click',()=>{cbFilter=key;render();});
    fr.appendChild(b);
  });
  cb.appendChild(fr);
  let allNote=KCAP==='off'
    ?'Cap total (keepers are cap-exempt — governed by the budget). '
    :'Opening cap by source — solid = keepers, faded = draft picks. ';
  allNote+=isFinite(CFG.cap)?('Red dashed line = '+CAPTXT+' cap'):'No cap set';
  if(CFG.floor>0){
    allNote+='; gold dashed line = the $'+CFG.floor+' floor — trades can’t leave a roster '
      +(isFinite(CFG.cap)?'above the cap or ':'')+'below it.';
  }else{
    allNote+='.';
  }
  const notes={all:allNote,
               k:'Keeper salary only — each team’s 3 keeps priced at their keep round.',
               d:'Draft-round salary only, from the picks each team holds for 2026.'};
  cb.appendChild($('p','cardnote2',notes[cbFilter]));
  const scale=cbFilter==='k'?120:250;
  const capLine=cbFilter==='d'||cbFilter==='k'?null:(isFinite(CFG.cap)?CFG.cap:null);
  const floorLine=(cbFilter==='all'&&CFG.floor>0)?CFG.floor:null;
  const rows=DATA.teams.map((tm,ti)=>{
    const ev=evalTeam(ti);
    const val=cbFilter==='k'?ev.keepSpend:(cbFilter==='d'?ev.draftSpend:ev.opening);
    return {name:tm.name,ti,ev,val};
  }).sort((a,b)=>b.val-a.val);
  rows.forEach(r=>{
    const isOpen=cbOpen===r.ti;
    const row=$('div','cbrow clickable');
    row.tabIndex=0;
    const tog=()=>{cbOpen=isOpen?-1:r.ti;render();};
    row.addEventListener('click',tog);
    row.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();tog();}});
    const nm=$('div','cbname'+(r.ti===myTeam?' good':''));
    nm.appendChild($('span','caret',isOpen?'▾':'▸'));
    nm.appendChild($('span','cbteam',r.name));
    row.appendChild(nm);
    const track=$('div','cbtrack');
    let x=0;
    /* round-slot: keeper salaries live INSIDE the pick total — carve them out
       of the draft segment instead of stacking on top (no double counting) */
    const kseg=Math.min(r.ev.keepSpend,r.ev.draftSpend);
    const segs=cbFilter==='all'?[['k',kseg],['d',r.ev.draftSpend-kseg],['f',r.ev.fills*CFG.waiver]]
      :(cbFilter==='k'?[['k',r.ev.keepSpend]]:[['d',r.ev.draftSpend]]);
    segs.forEach(([cls,v])=>{
      if(v<=0)return;
      const seg=$('div','cbseg '+cls);
      seg.style.left=(x/scale*100)+'%';seg.style.width=(Math.min(v,scale-x)/scale*100)+'%';
      track.appendChild(seg);x+=v;
    });
    if(capLine!==null){const cap=$('div','cbcap');cap.style.left=(capLine/scale*100)+'%';track.appendChild(cap);}
    if(floorLine!==null){const fl=$('div','cbfloor');fl.style.left=(floorLine/scale*100)+'%';track.appendChild(fl);}
    row.appendChild(track);
    const val=$('div','cbval');
    const over=cbFilter==='all'&&r.val>CFG.cap;
    val.appendChild($('b',over?'bad':'','$'+r.val));
    const sub=cbFilter==='all'
      ?(KCAP==='off'?('keepers $'+r.ev.keepSpend+' exempt'):((r.val?Math.round(r.ev.keepSpend/r.val*100):0)+'% keepers'))
      :(cbFilter==='k'?(r.ev.k+' keep'+(r.ev.k===1?'':'s')):r.ev.usedPicks+' picks');
    val.appendChild($('span','mut small',sub));
    row.appendChild(val);
    cb.appendChild(row);
    if(isOpen)cb.appendChild(capDetail(r.ti));
  });
  cb.appendChild(tradeBtn());
  cb.appendChild($('p','cardnote','Tap any team for the full story — every pick they hold, every pick they traded, and their keepers straight from Sleeper (synced on every visit).'));
  return cb;
}

function tradeBtn(){
  const go=$('a','gobtn','🔁 Test a trade — see exactly how a deal moves these numbers');
  go.href='analyzer.html';
  return go;
}


let liveSub=null,liveStatus=null;
render();

/* live keeper sync — official Sleeper keepers refresh on every visit */
syncSleeper().then(m=>{if(m)render();}).catch(()=>{});

/* live 2026 status check — the league is renewed; watch for the draft getting scheduled */
(async function(){
  try{
    if(!DATA.leagueId2026)return;
    const base='https://api.sleeper.app/v1/league/'+DATA.leagueId2026;
    const [lg,drafts]=await Promise.all([
      fetch(base).then(r=>r.json()),fetch(base+'/drafts').then(r=>r.json())]);
    const d=(drafts||[])[0];
    const when=d&&d.start_time
      ?new Date(d.start_time).toLocaleDateString('en-US',{month:'short',day:'numeric'}):null;
    liveSub=lg.name+' is renewed on Sleeper ('+lg.status.replace('_',' ')+') — '
      +(when?('draft scheduled for '+when):'draft not scheduled yet')
      +'. Official keepers sync here as teams set them.';
    liveStatus='renewed ✓ · '+(when?('draft '+when):'draft not set');
    document.getElementById('heroSub').textContent=liveSub;
    render();
  }catch(e){}
})();
</script>
